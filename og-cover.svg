<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b6b48"/>
      <stop offset="0.55" stop-color="#2d8b61"/>
      <stop offset="1" stop-color="#52b888"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd87a"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- 装饰圆 -->
  <circle cx="1050" cy="120" r="220" fill="#ffffff" opacity="0.06"/>
  <circle cx="160" cy="560" r="180" fill="#ffffff" opacity="0.05"/>
  <!-- 顶部徽标 -->
  <rect x="80" y="78" width="230" height="46" rx="23" fill="url(#badge)"/>
  <text x="195" y="108" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="700" fill="#5a3d00" text-anchor="middle">每周更新 · 第20期</text>
  <!-- 主标题 -->
  <text x="80" y="250" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="72" font-weight="800" fill="#ffffff">微信生态每周更新汇总</text>
  <!-- 副标题 -->
  <text x="82" y="320" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="30" fill="#eafff2">公众号 · 小程序 · 视频号 · 微信小店 · 推客 · 企业微信 · 开放平台 · 微信支付</text>
  <!-- 分隔线 -->
  <rect x="82" y="360" width="1036" height="2" fill="#ffffff" opacity="0.25"/>
  <!-- 本期要点 -->
  <text x="82" y="420" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="700" fill="#ffd87a">本期重点（2026.9.7–9.13）</text>
  <text x="82" y="470" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="25" fill="#ffffff">· 微信小店规则治理密集落地（热招品牌 / 无人机实名 / 珍珠质检）</text>
  <text x="82" y="512" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="25" fill="#ffffff">· 微信开放平台「接入微信 AI 生态指引」自动模式内测开启</text>
  <text x="82" y="554" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="25" fill="#ffffff">· 微信支付服贸会展示跨境收付通 / 全球收银台</text>
</svg>
